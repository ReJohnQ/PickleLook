<style>
:root, [data-theme="light"] {
  --bg: #f8f7f4;
  --surface: #ffffff;
  --surface-subtle: #f3f1ec;
  --surface-elevated: #ffffff;
  --text: #1c1b18;
  --text-muted: #6b675e;
  --border: #dfdcd4;
  --primary: #026b72;
  --primary-hover: #014e53;
  --primary-bg: #e6f3f3;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 8px 24px rgba(0,0,0,0.12);
  --shadow-sheet: 0 -6px 28px rgba(0,0,0,0.16);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
  --font: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --display: 'Zodiak', Georgia, serif;
}

[data-theme="dark"] {
  --bg: #121211;
  --surface: #1c1c1a;
  --surface-subtle: #252422;
  --surface-elevated: #282724;
  --text: #edeae4;
  --text-muted: #9e9a91;
  --border: #3b3935;
  --primary: #2eb4bd;
  --primary-hover: #50c4cc;
  --primary-bg: #163638;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 8px 24px rgba(0,0,0,0.5);
  --shadow-sheet: 0 -6px 28px rgba(0,0,0,0.6);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  height: 100dvh;
  width: 100%;
  overflow: hidden;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
}

body {
  display: flex;
  flex-direction: column;
  position: relative;
  padding-top: var(--safe-top);
}

.app-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  z-index: 100;
  flex-shrink: 0;
}

.app-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.app-logo {
  width: 42px;
  height: 42px;
  object-fit: contain;
  flex-shrink: 0;
}

.app-titles {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.app-title {
  font-family: var(--display);
  font-size: 1.18rem;
  font-weight: 700;
  line-height: 1.1;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.app-tagline {
  font-size: 0.7rem;
  color: var(--text-muted);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.header-tools {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.action-btn {
  min-height: 36px;
  min-width: 36px;
  padding: 0 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface-subtle);
  color: var(--text);
  font-size: 0.8rem;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.action-btn:active { transform: scale(0.96); background: var(--border); }

.controls-panel {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 8px 12px 6px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 90;
  flex-shrink: 0;
}

.search-bar-row {
  display: flex;
  gap: 6px;
  align-items: center;
}

.search-input-wrap {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;
}

.search-input-wrap input {
  width: 100%;
  height: 38px;
  padding: 0 32px 0 34px;
  border-radius: 19px;
  border: 1px solid var(--border);
  background: var(--surface-subtle);
  color: var(--text);
  font-size: 0.85rem;
  font-family: inherit;
  outline: none;
  -webkit-appearance: none;
}
.search-input-wrap input:focus {
  border-color: var(--primary);
  background: var(--surface);
}

.search-leading-icon {
  position: absolute;
  left: 11px;
  font-size: 14px;
  color: var(--text-muted);
  pointer-events: none;
}

.search-clear-btn {
  position: absolute;
  right: 6px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  display: none;
  place-items: center;
  font-size: 14px;
}

.gps-btn {
  height: 38px;
  padding: 0 12px;
  border-radius: 19px;
  border: 1px solid var(--primary);
  background: var(--primary-bg);
  color: var(--primary);
  font-size: 0.78rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  white-space: nowrap;
}
.gps-btn:active { transform: scale(0.96); background: var(--primary); color: #fff; }

.filters-scroll {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 2px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.filters-scroll::-webkit-scrollbar { display: none; }

.chip {
  height: 28px;
  padding: 0 10px;
  border-radius: 14px;
  font-size: 0.74rem;
  font-weight: 600;
  border: 1px solid var(--border);
  background: var(--surface-subtle);
  color: var(--text-muted);
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  transition: all 0.12s ease;
  flex-shrink: 0;
}
.chip:active { transform: scale(0.95); }
.chip.active {
  background: var(--text);
  color: var(--surface);
  border-color: var(--text);
}
.chip-badge {
  font-size: 0.68rem;
  padding: 1px 5px;
  border-radius: 8px;
  background: rgba(0,0,0,0.08);
}
.chip.active .chip-badge {
  background: rgba(255,255,255,0.25);
}

.viewport-stage {
  flex: 1;
  position: relative;
  overflow: hidden;
}

#mapView {
  width: 100%;
  height: 100%;
  z-index: 10;
}

.map-floating-controls {
  position: absolute;
  right: 12px;
  top: 12px;
  z-index: 30;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.fab-btn {
  width: 44px;
  height: 44px;
  border-radius: 22px;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-md);
  display: grid;
  place-items: center;
  font-size: 18px;
  cursor: pointer;
}
.fab-btn:active { transform: scale(0.92); }

.bottom-sheet {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 75dvh;
  background: var(--surface-elevated);
  border-top-left-radius: 18px;
  border-top-right-radius: 18px;
  box-shadow: var(--shadow-sheet);
  border-top: 1px solid var(--border);
  z-index: 40;
  display: flex;
  flex-direction: column;
  transform: translateY(calc(100% - 44px));
  transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.15);
}

.bottom-sheet.state-expanded { transform: translateY(0%); }
.bottom-sheet.state-half { transform: translateY(calc(100% - min(32dvh, 240px))); }
.bottom-sheet.state-collapsed { transform: translateY(calc(100% - 44px)); }

.sheet-handle-area {
  padding: 5px 16px 5px;
  min-height: 44px;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: grab;
  user-select: none;
  border-bottom: 1px solid var(--border);
  background: var(--surface-subtle);
  border-top-left-radius: 18px;
  border-top-right-radius: 18px;
  flex-shrink: 0;
}

.sheet-pill-bar {
  width: 40px;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
  margin-bottom: 3px;
}

.sheet-header-info {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.sheet-count {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--text);
}

.sheet-toggle-text {
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--primary);
  background: none;
  border: none;
  cursor: pointer;
}

.sheet-scroll-content {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 8px 12px calc(8px + var(--safe-bottom));
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.site-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 12px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  gap: 5px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.site-card:active { transform: scale(0.985); }
.site-card.is-active {
  border-color: var(--primary);
  background: var(--primary-bg);
  box-shadow: var(--shadow-md);
}

.card-headline-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}

.card-title {
  font-size: 0.95rem;
  font-weight: 800;
  line-height: 1.25;
  color: var(--text);
}

.status-badge {
  font-size: 0.65rem;
  font-weight: 800;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 10px;
  color: #fff;
  white-space: nowrap;
  letter-spacing: 0.03em;
  flex-shrink: 0;
}

.card-subloc {
  font-size: 0.75rem;
  color: var(--text-muted);
  font-weight: 500;
}

.card-timing-pill {
  font-size: 0.74rem;
  color: var(--text);
  background: var(--bg);
  padding: 4px 8px;
  border-radius: 6px;
  border-left: 3px solid var(--primary);
  font-weight: 600;
}

.card-setup-desc {
  font-size: 0.73rem;
  color: var(--text-muted);
  line-height: 1.35;
}

.card-actions-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 4px;
  padding-top: 6px;
  border-top: 1px dashed var(--border);
  gap: 6px;
}

.nav-links-row {
  display: flex;
  gap: 6px;
}

.nav-app-btn {
  padding: 4px 8px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface-subtle);
  color: var(--text);
  font-size: 0.7rem;
  font-weight: 700;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.nav-app-btn:active { background: var(--border); }

.toast-notice {
  position: fixed;
  bottom: calc(85px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(28, 27, 24, 0.94);
  color: #fff;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 0.78rem;
  font-weight: 700;
  z-index: 2000;
  opacity: 0;
  pointer-events: none;
  transition: all 0.2s ease;
  box-shadow: var(--shadow-md);
  white-space: nowrap;
}
.toast-notice.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.map-court-pin {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid #ffffff;
  box-shadow: 0 2px 6px rgba(0,0,0,0.35);
  display: grid;
  place-items: center;
  color: #ffffff;
  font-weight: 800;
  font-size: 12px;
  transition: transform 0.15s;
}
.map-court-pin:hover { transform: scale(1.2); }

@media (min-width: 860px) {
  .bottom-sheet {
    position: absolute;
    top: 14px;
    left: 14px;
    bottom: 14px;
    width: 380px;
    height: auto;
    border-radius: 14px;
    transform: none !important;
    border: 1px solid var(--border);
  }
  .sheet-handle-area {
    cursor: default;
    border-top-left-radius: 14px;
    border-top-right-radius: 14px;
  }
  .sheet-pill-bar { display: none; }
  .sheet-toggle-text { display: none; }
}
[hidden] { display:none !important; }
.selected-court-details { padding:16px 20px calc(20px + var(--safe-bottom)); gap:10px; }
.selected-court-details h3 { font-size:1.15rem; margin:5px 0; }
.selected-court-details p { margin:2px 0; line-height:1.5; }
.detail-back { align-self:flex-start; background:transparent; color:var(--primary); border:0; font:inherit; font-weight:700; padding:8px 0; cursor:pointer; }
.detail-directions { display:block; padding:12px; border-radius:9px; text-align:center; background:var(--primary); color:white; font-weight:700; text-decoration:none; }

/* v0.1.9.1: hide future candidate locations from player discovery; desktop layout remains unchanged. */
.mobile-filter-btn, .mobile-courts-btn, .mobile-sheet-close { display:none; }
@media (max-width: 859px) {
  .app-header { padding: 5px 10px; }
  .app-logo { width:36px; height:36px; }
  .app-tagline { font-size:0.62rem; }
  .controls-panel { padding: 7px 9px; gap: 0; }
  .search-bar-row { gap: 6px; }
  .search-input-wrap input, .gps-btn { height:44px; }
  .gps-btn { padding: 0 9px; }
  .mobile-filter-btn { display:inline-flex; min-height:44px; min-width:44px; padding:0 9px; }
  .controls-panel:not(.mobile-filters-open) .filters-scroll { display:none; }
  .controls-panel.mobile-filters-open .filters-scroll { margin-top:9px; }
  .filters-scroll .chip { min-height:44px; border-radius:22px; }
  .mobile-courts-btn { display:block; position:absolute; left:50%; bottom:calc(16px + var(--safe-bottom)); transform:translateX(-50%); z-index:35; border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:26px; padding:12px 20px; min-height:48px; font:inherit; font-size:0.87rem; font-weight:800; box-shadow:var(--shadow-md); white-space:nowrap; cursor:pointer; }
  .mobile-courts-btn[hidden] { display:none; }
  .mobile-sheet-close { display:grid; place-items:center; min-width:44px; min-height:44px; border:0; border-radius:22px; background:var(--surface); color:var(--text); font-size:22px; cursor:pointer; }
  .bottom-sheet { height:min(78dvh, 680px); border-radius:18px 18px 0 0; }
  .bottom-sheet.state-collapsed { transform:translateY(100%); visibility:hidden; pointer-events:none; }
  .bottom-sheet.state-half { transform:translateY(calc(100% - min(34dvh, 255px))); }
  .bottom-sheet.state-expanded { transform:translateY(0); }
  .sheet-handle-area { flex-direction:row; padding:5px 10px 5px 14px; min-height:52px; gap:8px; }
  .sheet-pill-bar { display:none; }
  .sheet-count { font-size:0.83rem; }
  .sheet-toggle-text { min-height:44px; padding:0 8px; }
  .sheet-scroll-content { overscroll-behavior:contain; }
  .selected-court-details { padding:10px 16px calc(18px + var(--safe-bottom)); }
  .map-court-pin { width:34px; height:34px; }
  .map-floating-controls { top:10px; right:10px; }
}
@media (prefers-reduced-motion: reduce) { .bottom-sheet { transition:none; } }

.restroom-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border, #d6dedb); }
.restroom-section h4 { margin: 0 0 8px; font-size: 1rem; }
.restroom-section p { margin: 3px 0; font-size: .88rem; }
.restroom-item { padding: 9px 0; border-bottom: 1px solid var(--border, #d6dedb); }
.restroom-item strong { font-size: .92rem; }
.restroom-item a, .restroom-section > a { display: inline-block; margin: 5px 0; color: var(--primary, #026b72); }
.restroom-disclaimer { opacity: .78; }

/* v0.2.0: inline marker legend and optional closest-court list */
.filter-pin { display:inline-grid; place-items:center; width:24px; height:24px; border-radius:50%; background:var(--pin); color:white; font-weight:800; font-size:13px; flex:none; }
#closestCourtsBtn[hidden] { display:none !important; }
.closest-heading { font-size:.85rem; font-weight:700; padding:10px 12px; margin:0; }
.closest-result { display:flex; flex-direction:column; align-items:flex-start; gap:5px; width:100%; padding:13px 14px; border:0; border-bottom:1px solid var(--border); background:var(--surface); color:var(--text); text-align:left; cursor:pointer; min-height:56px; font:inherit; }
.closest-result span { font-size:.82rem; opacity:.8; }
.closest-result:focus-visible { outline:3px solid var(--primary); outline-offset:-3px; }
</style>

const boroughCenters = {

let userLocationMarker = null;

// Court counts and key feedback must work even if the mapping library fails.
function initializeCourtCounts() {
  const boroughIds = { 'Manhattan': 'badgeMan', 'Brooklyn': 'badgeBk', 'Queens': 'badgeQns', 'Bronx': 'badgeBx', 'Staten Island': 'badgeSi' };
  document.getElementById('badgeAll').textContent = sitesData.length;
  for (const [borough, id] of Object.entries(boroughIds)) {
    document.getElementById(id).textContent = sitesData.filter(s => s.borough === borough).length;
  }
}
initializeCourtCounts();
if (typeof window.L === 'undefined') {
  document.getElementById('mapView').textContent = 'Map unavailable. Check your internet connection or browser extensions, then reload.';
  throw new Error('Leaflet library unavailable; court data remains intact.');
}

const map = L.map('mapView', {
  zoomControl: false,
  tap: true,
  touchZoom: true
}).setView(boroughCenters.all.center, boroughCenters.all.zoom);

L.control.zoom({ position: 'topleft' }).addTo(map);

// Public, domain-restricted CARTO browser key. Browser keys cannot be kept secret

const publicCartoKey = 'cb1_4ywu_1_50949fa8b7fec330831ac23a';
const pickleLookBasemap = L.tileLayer(

  if (!tileErrorShown) {
    tileErrorShown = true;
    showToast('Map background unavailable. Check your connection.');
  }
});
pickleLookBasemap.addTo(map);

function showToast(msg) {
  const toast = document.getElementById('toastNotice');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function updateBadgeCounts() {
  document.getElementById('badgeAll').textContent = sitesData.length;
  document.getElementById('badgeMan').textContent = sitesData.filter(s => s.borough === 'Manhattan').length;
  document.getElementById('badgeBk').textContent = sitesData.filter(s => s.borough === 'Brooklyn').length;
  document.getElementById('badgeQns').textContent = sitesData.filter(s => s.borough === 'Queens').length;
  document.getElementById('badgeBx').textContent = sitesData.filter(s => s.borough === 'Bronx').length;
  document.getElementById('badgeSi').textContent = sitesData.filter(s => s.borough === 'Staten Island').length;
}

function getFilteredSites() {
  return sitesData.filter(site => {
    if (activeBorough !== 'all' && site.borough !== activeBorough) return false;
    if (activeType !== 'all' && !(activeType === 'scheduled' ? (site.cat === 'scheduled' || site.cat === 'interim') : site.cat === activeType)) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      const text = `${site.name} ${site.neighborhood} ${site.address} ${site.conditions} ${site.hours}`.toLowerCase();
      if (!text.includes(q)) return false;
    }
    return true;
  });
}

function getPinIcon(site) {
  const conf = typeConfig[site.cat] || { color: "#0c8599", symbol: "•" };
  return L.divIcon({
    className: '',
    iconSize: [28, 28],
    iconAnchor: [14, 14],
    popupAnchor: [0, -14],
    html: `<div class="map-court-pin" style="background:${conf.color};">${conf.symbol}</div>`
  });
}

function buildDirectionsUrl(lat, lng, name) {
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const encodedName = encodeURIComponent(name);
  if (isIOS) {
    return `https://maps.apple.com/?daddr=${lat},${lng}&q=${encodedName}`;
  }
  return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
}

function renderSites() {
  currentMarkers.forEach(m => map.removeLayer(m));
  currentMarkers = [];
  markerById.clear();
  closestMode = false;

  const visible = getFilteredSites();
  const mobileCourtsBtn = document.getElementById('mobileCourtsBtn');
  mobileCourtsBtn.textContent = `☰ View ${visible.length} Courts`;
  const container = document.getElementById('sheetCardsContainer');
  container.innerHTML = '';
  document.getElementById("selectedCourtDetails").hidden = true;
  container.hidden = false;

  document.getElementById('sheetResultsCount').textContent = `${visible.length} location${visible.length === 1 ? '' : 's'} available`;

  visible.forEach(site => {
    const conf = typeConfig[site.cat] || { label: "Court", color: "#026b72" };
    const marker = L.marker([site.lat, site.lng], { icon: getPinIcon(site) });
    const navUrl = buildDirectionsUrl(site.lat, site.lng, site.name);

    marker.bindPopup(`
      <div style="font-family:var(--font); font-size:12px; line-height:1.35; min-width:210px;">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:6px;">
          <span class="status-badge" style="background:${conf.color};">${conf.label}</span>
        </div>
        <h4 style="font-size:13px; font-weight:800; margin:5px 0 2px;">${site.name}</h4>
        <div style="color:var(--text-muted); font-size:11px;">${site.address}, ${site.neighborhood}</div>
        <div style="margin-top:6px; font-size:11.5px;"><strong>⏰ Hours:</strong> ${site.hours}</div>
        <div style="margin-top:3px; font-size:11px;"><strong>🏸 Courts:</strong> ${site.courts} (${site.conditions})</div>
        <div style="margin-top:8px; display:flex; gap:6px;">
          <a href="${navUrl}" target="_blank" rel="noopener noreferrer" style="flex:1; text-align:center; padding:5px; background:var(--primary); color:#fff; border-radius:6px; text-decoration:none; font-weight:700; font-size:11px;">🧭 Directions</a>
        </div>
      </div>
    `);

    marker.addTo(map);
    marker.on("click", () => selectCourt(site, marker));
    currentMarkers.push(marker);
    markerById.set(site.id, marker);

    const card = document.createElement('div');
    card.className = 'site-card';
    card.innerHTML = `
      <div class="card-headline-row">
        <div class="card-title">${site.name}</div>
        <span class="status-badge" style="background:${conf.color};">${conf.label}</span>
      </div>
      <div class="card-subloc">${site.neighborhood}, ${site.borough} · ${site.courts} Court${site.courts === 1 ? '' : 's'}</div>
      <div class="card-timing-pill">⏰ ${site.hours}</div>
      <div class="card-setup-desc">${site.conditions}</div>
      <div class="card-actions-row">
        <div class="nav-links-row">
          <a class="nav-app-btn" href="${navUrl}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();">🧭 Maps</a>
        </div>
      </div>
    `;

    card.onclick = () => {
      selectCourt(site, marker, card);
    };

    container.appendChild(card);
  });
}

    restroomDataPromise = fetch(RESTROOM_DATA_URL, { mode: 'cors' })
      .then(response => { if (!response.ok) throw new Error('NYC Open Data unavailable'); return response.json(); })
      .then(rows => rows.filter(row =>
        String(row.status || '').trim().toLowerCase() === 'operational' &&
        Number.isFinite(Number(row.latitude)) && Number.isFinite(Number(row.longitude)) &&
        row.latitude != null && row.longitude != null
      ))
      .catch(error => { restroomDataPromise = null; throw error; });
  }
  return restroomDataPromise;
}
function straightLineMeters(lat1, lng1, lat2, lng2) {
  const radians = degrees => degrees * Math.PI / 180;
  const dLat = radians(lat2 - lat1), dLng = radians(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(radians(lat1)) * Math.cos(radians(lat2)) * Math.sin(dLng / 2) ** 2;
  return 6371000 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function renderNearbyRestrooms(site, target, requestId) {
  if (site.cat === 'indoor') return;
  const heading = document.createElement('h4'); heading.textContent = '🚻 Nearby public restrooms';
  const status = document.createElement('p'); status.textContent = 'Checking NYC Open Data…';
  const source = document.createElement('a'); source.href = RESTROOM_SOURCE_URL;
  source.target = '_blank'; source.rel = 'noopener noreferrer'; source.textContent = 'NYC public restroom data';
  const note = document.createElement('p'); note.className = 'restroom-disclaimer';
  note.textContent = 'Listed status is not live. Distances are straight-line estimates; walking access and hours may differ.';
  target.append(heading, status, note, source);
  loadRestroomData().then(rows => {
    if (requestId !== selectedRestroomRequest || !target.isConnected) return;
    const nearby = rows.map(row => ({row, distance: straightLineMeters(site.lat, site.lng, Number(row.latitude), Number(row.longitude))}))
      .filter(item => item.distance <= 800).sort((a,b) => a.distance - b.distance).slice(0,3);
    status.replaceChildren();
    if (!nearby.length) {
      status.textContent = 'No operational restroom listed within 800 m. This does not mean none exists.';
      return;
    }
    for (const {row, distance} of nearby) {
      const item = document.createElement('div'); item.className = 'restroom-item';
      const name = document.createElement('strong'); name.textContent = row.facility_name || 'Public restroom';
      const meta = document.createElement('p');
      meta.textContent = `${Math.round(distance / 10) * 10} m away (straight line) · Listed operational`;
      item.append(name, meta);
      if (row.hours_of_operation) {
        const hours = document.createElement('p'); hours.textContent = 'Hours listed: ' + row.hours_of_operation;
        item.append(hours);
      }
      if (row.open) {
        const season = document.createElement('p'); season.textContent = 'Seasonality: ' + row.open;
        item.append(season);
      }
      if (row.accessibility) {
        const access = document.createElement('p'); access.textContent = 'Accessibility: ' + row.accessibility;
        item.append(access);
      }
      const link = document.createElement('a');
      link.href = buildDirectionsUrl(Number(row.latitude), Number(row.longitude), row.facility_name || 'Public restroom');
      link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Directions to restroom';
      item.append(link); status.append(item);
    }
  }).catch(() => {
    if (requestId === selectedRestroomRequest && target.isConnected)
      status.textContent = 'Restroom listings could not be loaded. Use the NYC data link below.';
  });
}

function selectCourt(site, marker, card) {
  document.querySelectorAll('.site-card').forEach(c => c.classList.remove('is-active'));
  if (card) card.classList.add('is-active');
  const details = document.getElementById('selectedCourtDetails');
  const conf = typeConfig[site.cat] || { label: 'Court', color: '#026b72' };
  details.replaceChildren();
  const back = document.createElement('button');
  back.type = 'button'; back.className = 'detail-back'; back.textContent = '← Back to courts';
  back.onclick = () => { details.hidden = true; document.getElementById('sheetCardsContainer').hidden = false; setSheetState('state-expanded'); };
  const title = document.createElement('h3'); title.textContent = site.name;
  const category = document.createElement('p'); category.textContent = conf.label + ' · ' + site.neighborhood + ', ' + site.borough;
  const address = document.createElement('p'); address.textContent = site.address;
  const hours = document.createElement('p'); hours.textContent = '⏰ Hours: ' + site.hours;
  const courts = document.createElement('p'); courts.textContent = '🏸 Courts: ' + site.courts + ' (' + site.conditions + ')';
  const directions = document.createElement('a'); directions.className = 'detail-directions';
  directions.textContent = '🧭 Directions'; directions.href = buildDirectionsUrl(site.lat, site.lng, site.name);
  directions.target = '_blank'; directions.rel = 'noopener noreferrer';
  details.append(back, title, category, address, hours, courts, directions);
  const restroomSection = document.createElement('section');
  restroomSection.className = 'restroom-section';
  details.append(restroomSection);
  renderNearbyRestrooms(site, restroomSection, ++selectedRestroomRequest);
  details.hidden = false;
  document.getElementById('sheetCardsContainer').hidden = true;
  if (window.innerWidth < 860) {
    map.closePopup();
    setSheetState('state-half');
    map.flyTo([site.lat, site.lng], 15, { duration: 0.6 });
  } else {
    map.flyTo([site.lat, site.lng], 15, { duration: 0.6 });
    map.closePopup();
  }
}

const sheet = document.getElementById('courtSheet');
const sheetHandle = document.getElementById('sheetHandle');
const sheetToggleBtn = document.getElementById('sheetToggleBtn');
const mobileCourtsBtn = document.getElementById('mobileCourtsBtn');
const mobileFilterBtn = document.getElementById('mobileFilterBtn');
const controlsPanel = document.querySelector('.controls-panel');
mobileFilterBtn.onclick = () => {
  const open = controlsPanel.classList.toggle('mobile-filters-open');
  mobileFilterBtn.setAttribute('aria-expanded', String(open));
  mobileFilterBtn.setAttribute('aria-label', open ? 'Hide court filters' : 'Show court filters');
};
mobileCourtsBtn.onclick = () => {
  if (closestMode) renderSites();
  document.getElementById('selectedCourtDetails').hidden = true;
  document.getElementById('sheetCardsContainer').hidden = false;
  setSheetState('state-expanded');
};
document.getElementById('mobileSheetClose').onclick = (event) => {
  event.stopPropagation(); // Prevent the parent sheet handle from immediately reopening it.
  setSheetState('state-collapsed');
};


function setSheetState(state) {
  sheet.classList.remove('state-expanded', 'state-half', 'state-collapsed');
  sheet.classList.add(state);
  const mobileOpen = window.innerWidth < 860 && state !== 'state-collapsed';
  mobileCourtsBtn.hidden = mobileOpen;
  mobileCourtsBtn.setAttribute('aria-expanded', String(mobileOpen));
  if (window.innerWidth < 860) sheet.setAttribute('aria-hidden', String(!mobileOpen));
  else sheet.removeAttribute('aria-hidden');
  if (state === 'state-expanded') {
    sheetToggleBtn.textContent = 'Collapse List ▼';
  } else if (state === 'state-collapsed') {
    sheetToggleBtn.textContent = 'Expand List ▲';
  } else {
    sheetToggleBtn.textContent = 'Full List ▲';
  }
}

sheetToggleBtn.onclick = (event) => {
  event.stopPropagation(); // Do not also trigger the parent handle's click action.
  if (sheet.classList.contains('state-expanded')) {
    setSheetState('state-collapsed');
  } else {
    setSheetState('state-expanded');
  }
};

// Mobile swipe gestures on the handle: swipe down to reveal more map,
// swipe up to reveal more court details. No interference with map gestures.
let sheetTouchStartY = null;
sheetHandle.addEventListener('touchstart', e => {
  sheetTouchStartY = e.touches[0]?.clientY ?? null;
}, { passive: true });
sheetHandle.addEventListener('touchend', e => {
  if (window.innerWidth >= 860 || sheetTouchStartY === null) return;
  const delta = (e.changedTouches[0]?.clientY ?? sheetTouchStartY) - sheetTouchStartY;
  sheetTouchStartY = null;
  if (Math.abs(delta) < 35) return;
  sheet.dataset.ignoreNextClick = 'true';
  if (delta > 0) setSheetState('state-collapsed');
  else setSheetState('state-expanded');
}, { passive: true });

sheetHandle.onclick = (e) => {
  if (sheet.dataset.ignoreNextClick === 'true') { delete sheet.dataset.ignoreNextClick; return; }
  if (e.target.closest('button')) return; // Header buttons own their clicks.
  if (window.innerWidth >= 860) return;
  if (sheet.classList.contains('state-collapsed')) {
    setSheetState('state-half');
  } else if (sheet.classList.contains('state-half')) {
    setSheetState('state-expanded');
  } else {
    setSheetState('state-collapsed');
  }
};

document.querySelectorAll('#boroughChips .chip').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#boroughChips .chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeBorough = btn.dataset.borough;
    renderSites();
    if (boroughCenters[activeBorough]) {
      map.flyTo(boroughCenters[activeBorough].center, boroughCenters[activeBorough].zoom, { duration: 0.7 });
    }
  };
});

document.querySelectorAll('#typeChips .chip').forEach(btn => {
  btn.onclick = () => {
    const requestedType = btn.dataset.type;
    // Selecting an already-active category toggles back to all court types.
    activeType = (requestedType !== 'all' && activeType === requestedType) ? 'all' : requestedType;
    document.querySelectorAll('#typeChips .chip').forEach(b => {
      const selected = b.dataset.type === activeType;
      b.classList.toggle('active', selected);
      b.setAttribute('aria-pressed', String(selected));
    });
    renderSites();
  };
});

const searchInput = document.getElementById('courtSearchInput');
const clearBtn = document.getElementById('searchClearBtn');

searchInput.oninput = (e) => {
  searchQuery = e.target.value.trim();
  clearBtn.style.display = searchQuery ? 'grid' : 'none';
  renderSites();
};

clearBtn.onclick = () => {
  searchInput.value = '';
  searchQuery = '';
  clearBtn.style.display = 'none';
  renderSites();
};

document.getElementById('nearMeBtn').onclick = () => {
  if (!navigator.geolocation) {
    showToast("Geolocation not supported on this device.");
    return;
  }
  showToast("Locating your position...");
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const userLat = pos.coords.latitude;
      const userLng = pos.coords.longitude;
      userCoords = { lat: userLat, lng: userLng };
      document.getElementById('closestCourtsBtn').hidden = false;
      map.flyTo([userLat, userLng], 14, { duration: 0.9 });
      if (userLocationMarker) map.removeLayer(userLocationMarker);
      userLocationMarker = L.circleMarker([userLat, userLng], {
        radius: 8,
        fillColor: '#026b72',
        color: '#ffffff',
        weight: 3,
        opacity: 1,
        fillOpacity: 0.95
      }).addTo(map).bindPopup("<b>📍 You are here</b>").openPopup();
      showToast("Found your location!");
    },
    (err) => {
      showToast("Location access denied or unavailable.");
    },
    { enableHighAccuracy: true, timeout: 8000 }
  );
};

// Straight-line distance, not walking, cycling, or driving distance.
function distanceMeters(lat1, lon1, lat2, lon2) {
  const rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
  return 6371000 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function showClosestCourts() {
  if (!userCoords) { showToast('Tap Near Me first to find your location.'); return; }
  const nearby = getFilteredSites().map(site => ({
    site, distance: distanceMeters(userCoords.lat, userCoords.lng, site.lat, site.lng)
  })).sort((a, b) => a.distance - b.distance).slice(0, 5);
  const list = document.getElementById('sheetCardsContainer');
  list.replaceChildren();
  const heading = document.createElement('p');
  heading.className = 'closest-heading';
  heading.textContent = 'Closest courts · straight-line distance (not travel distance)';
  list.append(heading);
  if (!nearby.length) {
    const empty = document.createElement('p');
    empty.textContent = 'No courts match your current search and filters.';
    list.append(empty);
  }
  nearby.forEach(({ site, distance }, index) => {
    const button = document.createElement('button');
    button.type = 'button'; button.className = 'closest-result';
    const name = document.createElement('strong'); name.textContent = `${index + 1}. ${site.name}`;
    const detail = document.createElement('span');
    detail.textContent = `${(distance / 1000).toFixed(2)} km straight line · ${typeConfig[site.cat]?.label || 'Court'} · ${site.borough}`;
    button.append(name, detail);
    button.onclick = () => selectCourt(site, markerById.get(site.id));
    list.append(button);
  });
  closestMode = true;
  document.getElementById('selectedCourtDetails').hidden = true;
  list.hidden = false;
  document.getElementById('sheetResultsCount').textContent = `${nearby.length} closest court${nearby.length === 1 ? '' : 's'}`;
  setSheetState('state-expanded');
}
document.getElementById('closestCourtsBtn').onclick = showClosestCourts;

document.getElementById('recenterBtn').onclick = () => {
  map.flyTo(boroughCenters[activeBorough].center, boroughCenters[activeBorough].zoom, { duration: 0.6 });
};

const themeToggleBtn = document.getElementById('themeToggleBtn');
const themeMeta = document.getElementById('themeMetaColor');

themeToggleBtn.onclick = () => {
  const doc = document.documentElement;
  const isDark = doc.dataset.theme === 'dark';
  const newTheme = isDark ? 'light' : 'dark';
  doc.dataset.theme = newTheme;
  themeMeta.setAttribute('content', isDark ? '#ffffff' : '#121211');
};

window.addEventListener('resize', () => {
  if (window.innerWidth >= 860) {
    sheet.removeAttribute('aria-hidden');
    mobileCourtsBtn.hidden = false;
  } else {
    setSheetState('state-collapsed');
  }
});
updateBadgeCounts();
renderSites();
setSheetState('state-collapsed');
</script>
